{% extends "base.html" %}
{% block content %}
  {% if car_list %}
    <tbody>
    {% for car in car_list %}
      <li><a href="{% url 'taxi:car-detail' car.id %}">{{ car.model }}</a></li>
    {% endfor %}
    </tbody>
  {% else %}
    <p>Cars were not found</p>
  {% endif %}
{% endblock %}
